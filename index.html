<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Primary SEO -->
    <title>Sduella | Apply for Bursaries, Learnerships & Scholarships in South Africa</title>
    <meta name="description" content="Find and apply for bursaries, learnerships, scholarships, fellowships and YES programmes in South Africa. Check deadlines, filter by field, and apply before opportunities close." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured Data -->
    <script type="application/ld+json">

      "description": "Find and apply for bursaries, learnerships, scholarships, fellowships and YES programmes in South Africa.",

        "target": "https://sduella.com/bursaries?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
