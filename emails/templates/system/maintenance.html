{% extends "base.html" %}

{% block content %}
<tr>
  <td style="padding:36px 40px 8px;">
    <p style="margin:0 0 10px;color:#9a9a96;font-size:9px;font-weight:700;
      letter-spacing:2.5px;text-transform:uppercase;">— Maintenance</p>
    <p style="margin:0;color:#111111;font-size:32px;font-weight:900;
      line-height:1.15;letter-spacing:-0.8px;">
      Scheduled<br>maintenance.
    </p>
  </td>
</tr>

<tr>
  <td style="padding:24px 40px 28px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
      style="margin-bottom:24px;">
      <tr>
        <td style="background-color:#111111;border-left:4px solid #9a9a96;padding:18px 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td>
                <p style="margin:0;color:rgba(255,255,255,0.4);font-size:9px;font-weight:700;
                  letter-spacing:2px;text-transform:uppercase;">— Window</p>
                <p style="margin:8px 0 0;color:#ffffff;font-size:14px;font-weight:700;
                  line-height:1.5;">{{ start_time }} &mdash; {{ end_time }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <p style="margin:0;color:#555550;font-size:13px;line-height:1.75;">
      {{ description | default('Sduella will be briefly unavailable during this window. We apologise for any inconvenience.') }}
    </p>
  </td>
</tr>
{% endblock %}
