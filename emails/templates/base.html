<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{ title | default('Sduella') }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f0ee;font-family:Arial,Helvetica,sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
  style="background-color:#f0f0ee;">
  <tr>
    <td align="center" style="padding:48px 16px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0"
        style="width:100%;max-width:600px;background-color:#ffffff;border:1.5px solid #dcdcd8;">

        {% include "components/header.html" %}

        {% block content %}{% endblock %}

        {% include "components/footer.html" %}

      </table>

      <p style="margin:16px 0 0;color:#9a9a96;font-size:11px;text-align:center;">
        {% block outer_note %}
        You received this from <a href="https://www.sduella.com" style="color:#9a9a96;">www.sduella.com</a>
        {% endblock %}
      </p>

    </td>
  </tr>
</table>

</body>
</html>
