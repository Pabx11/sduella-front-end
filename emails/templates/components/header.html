<tr>
  <td style="padding:28px 40px 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td valign="middle">
          <img
            src="https://www.sduella.com/pictures/Sduella%20Modern%20Logo%20(1).svg"
            alt="Sduella" width="120" height="37"
            style="display:block;border:0;outline:none;" />
        </td>
        {% if doc_type %}
        <td valign="middle" align="right">
          <p style="margin:0;color:#9a9a96;font-size:9px;font-weight:700;
            letter-spacing:2px;text-transform:uppercase;">— {{ doc_type }}</p>
          {% if reference %}
          <p style="margin:5px 0 0;color:#111111;font-size:13px;font-weight:700;
            font-family:monospace,monospace;letter-spacing:0.5px;">{{ reference }}</p>
          {% endif %}
          {% if date %}
          <p style="margin:2px 0 0;color:#9a9a96;font-size:11px;">{{ date }}</p>
          {% endif %}
        </td>
        {% endif %}
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td style="padding:0 40px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr><td style="border-top:1px solid #ececea;font-size:0;line-height:0;">&nbsp;</td></tr>
    </table>
  </td>
</tr>
